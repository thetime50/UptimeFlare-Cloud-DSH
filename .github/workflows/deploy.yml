name: Deploy to Cloudflare

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2.0.3
        with:
          terraform_version: 1.6.4
          # wrapper 会把 import 失败记成整步失败，导致 apply 建不了 Worker
          terraform_wrapper: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          cache: 'npm'

      # Automatically get an account id via the API Token
      # if secrets.CLOUDFLARE_ACCOUNT_ID is not set.
      - name: Fetch Account ID
        id: fetch_account_id
        run: |
          if [[ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            echo "Using provided CLOUDFLARE_ACCOUNT_ID from secrets."
          else
            ACCOUNT_ID=$(curl -X GET "https://api.cloudflare.com/client/v4/accounts" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type:application/json" | jq ".result[0].id" -r)
            if [[ "$ACCOUNT_ID" == "null" ]]; then
              echo "Failed to get an account id, please make sure you have set up CLOUDFLARE_API_TOKEN correctly!"
              exit 1
            fi
          fi
          echo 'account_id='$ACCOUNT_ID >> $GITHUB_OUTPUT

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Install packages
        run: |
          npm install
          cd worker
          npm install

      - name: Build worker
        run: |
          cd worker
          npx wrangler deploy src/index.ts --outdir dist --dry-run

      - name: Build page
        run: |
          npx @cloudflare/next-on-pages

      - name: Create D1 database and tables
        run: |
          python3 deploy/init_d1.py  # This sets D1_ID in GITHUB_ENV

        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}

      - name: Migrate state from KV (if needed)
        run: |
          python3 deploy/migrate_kv.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
          D1_ID: ${{ env.D1_ID }}

      - name: Deploy using Terraform
        # CI 无持久 state：已有资源才 import；没有的由 apply 创建（不是“跳过错误凑合过”）
        run: |
          set -euo pipefail
          terraform init

          DO_RESP=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$TF_VAR_CLOUDFLARE_ACCOUNT_ID/workers/durable_objects/namespaces?per_page=1000" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          if echo "$DO_RESP" | jq -e '.result[] | select(.script == "uptimeflare_worker" and .class == "RemoteChecker")' > /dev/null; then
            echo "Existing Durable Object namespace found for uptimeflare_worker RemoteChecker. No migration needed."
          else
            echo "No existing Durable Object namespace found for uptimeflare_worker RemoteChecker. Need migration."
            export TF_VAR_enable_do_migration=true
          fi

          cf_get() {
            curl -sS -o /tmp/cf_get.json -w "%{http_code}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$1"
          }

          import_if_exists() {
            local resource="$1"
            local id="$2"
            local url="$3"
            local code
            code=$(cf_get "$url")
            case "$code" in
              200)
                echo "Importing $resource (API $code)..."
                terraform import "$resource" "$id"
                ;;
              404)
                echo "No existing $resource (API 404) — apply will create it"
                ;;
              403|401)
                echo "ERROR: Cloudflare API $code for $resource — token lacks permission (Pages needs Account Cloudflare Pages:Edit)."
                echo "Response: $(head -c 500 /tmp/cf_get.json || true)"
                exit 1
                ;;
              *)
                echo "ERROR: Unexpected API $code probing $resource"
                echo "Response: $(head -c 500 /tmp/cf_get.json || true)"
                exit 1
                ;;
            esac
          }

          ACCOUNT="$TF_VAR_CLOUDFLARE_ACCOUNT_ID"
          echo "Import existing resources when present..."
          terraform import cloudflare_d1_database.uptimeflare_d1 "$ACCOUNT/$D1_ID"
          import_if_exists cloudflare_workers_script.uptimeflare_worker \
            "$ACCOUNT/uptimeflare_worker" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/uptimeflare_worker"
          import_if_exists cloudflare_workers_cron_trigger.uptimeflare_worker_cron \
            "$ACCOUNT/uptimeflare_worker" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/uptimeflare_worker/schedules"

          # Pages: 403 means token cannot manage Pages — do not pretend it is missing.
          PAGES_CODE=$(cf_get "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/uptimeflare")
          case "$PAGES_CODE" in
            200)
              echo "Importing cloudflare_pages_project.uptimeflare (API 200)..."
              terraform import cloudflare_pages_project.uptimeflare "$ACCOUNT/uptimeflare"
              ;;
            404)
              echo "No existing Pages project (API 404) — apply will create it"
              ;;
            403|401)
              echo "WARNING: Pages API $PAGES_CODE — token likely missing Cloudflare Pages:Edit. Worker will still be applied; Pages step may fail."
              echo "Response: $(head -c 500 /tmp/cf_get.json || true)"
              ;;
            *)
              echo "ERROR: Unexpected API $PAGES_CODE probing Pages project"
              echo "Response: $(head -c 500 /tmp/cf_get.json || true)"
              exit 1
              ;;
          esac

          # Worker first so Pages permission issues cannot block creating the script
          echo "Applying Worker + Cron..."
          terraform apply -auto-approve -input=false \
            -target=cloudflare_workers_script.uptimeflare_worker \
            -target=cloudflare_workers_cron_trigger.uptimeflare_worker_cron

          if [[ "$PAGES_CODE" == "403" || "$PAGES_CODE" == "401" ]]; then
            echo "Worker/Cron apply finished, but Pages cannot be managed (API $PAGES_CODE)."
            echo "Add Account permission Cloudflare Pages:Edit to CLOUDFLARE_API_TOKEN, then re-run."
            exit 1
          fi

          echo "Applying remaining resources (Pages)..."
          if ! terraform apply -auto-approve -input=false; then
            echo "ERROR: Full apply failed. Check Cloudflare token permissions and re-run."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
          D1_ID: ${{ env.D1_ID }}

      # Currently Terraform Cloudflare provider doesn't support direct upload, use wrangler to upload instead.
      - name: Upload pages
        run: |
          npx wrangler pages deploy .vercel/output/static --project-name uptimeflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.fetch_account_id.outputs.account_id }}
